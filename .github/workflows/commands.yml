name: commands
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  pull-requests: write
  statuses: write
jobs:
  command:
    name: command
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: echo
        run: echo "PR #${{ github.event.issue.number }}"
