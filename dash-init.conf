# dash-init: gate the Kindle framework and show the dash on a flagged boot.
#
# Runs as soon as the userstore ( /mnt/us ) is mounted, so it can see the
# BOOT_TO_DASH flag. When the flag and the dash binary are both present:
#   - consumes BOOT_TO_DASH  (the NEXT reboot returns to stock)
#   - sets DONT_START_FRAMEWORK  (stops cvm so the dash render stays visible)
#   - runs /mnt/us/dash/dash-init (brings up SSH, renders the dash)
#   - leaves the device on the dash (e-ink retains the image; SSH stays up)
#
# When the flag or binary is absent, this job does nothing -> normal stock boot.

start on started filesystems_userstore
task

pre-start script
    # Clear any stale framework gate from a previous dash boot, so a normal
    # (non-flagged) boot always lets the Kindle framework start again.
    rm -f /mnt/us/DONT_START_FRAMEWORK
end script

script
    source /etc/upstart/functions

    DASH_INIT="/mnt/us/dash/dash-init"

    # Do nothing unless we were asked to boot into the dash.
    if [ ! -f /mnt/us/BOOT_TO_DASH ] || [ ! -x "$DASH_INIT" ] ; then
        exit 0
    fi

    f_log I dash-init boot_begin

    # One-shot: consume the flag so the next boot is plain stock (recovery).
    rm -f /mnt/us/BOOT_TO_DASH

    # Stop the Kindle GUI from starting and overwriting the dash render.
    # (pre-start just cleared any stale gate from a previous dash boot.)
    touch /mnt/us/DONT_START_FRAMEWORK

    # Bring up SSH + render the dash.
    "$DASH_INIT"
    rc=$?

    f_log I dash-init boot_end rc=$rc
    # NOTE: Do NOT reboot here. The e-ink panel retains the rendered dash, and
    # SSH (started by dash-init) stays up. Recovery to stock = SSH in + reboot;
    # the already-consumed flag guarantees that next boot is stock.
    exit 0
end script
